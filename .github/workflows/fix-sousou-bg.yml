name: Fix Sousou bg PNG one-byte corruption
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-sousou-bg.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sousou-bg-png
      - name: Patch corrupted byte and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/sousou-bg.png')
          d = bytearray(p.read_bytes())
          assert d[:8] == b'\x89PNG\r\n\x1a\n'
          # Single-byte corruption introduced during API upload (offset 4850: 0x1c -> 0x5c)
          assert d[4850] in (0x1c, 0x5c), hex(d[4850])
          d[4850] = 0x5c
          p.write_bytes(d)
          # Verify IHDR + full decode
          import struct, zlib
          w, h = struct.unpack('>II', d[16:24])
          assert (w, h) == (576, 576), (w, h)
          # zlib-decompress IDAT streams as a cheap integrity check
          i = 8
          idat = b''
          while i + 8 <= len(d):
              length = struct.unpack('>I', d[i:i+4])[0]
              ctype = d[i+4:i+8]
              chunk = d[i+8:i+8+length]
              if ctype == b'IDAT':
                  idat += chunk
              i += 12 + length
              if ctype == b'IEND':
                  break
          zlib.decompress(idat)
          print('fixed png', len(d), w, h, 'idat', len(idat))
          PY
          rm -f .github/workflows/fix-sousou-bg.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "fix: repair assets/sousou-bg.png (1-byte IDAT corruption)"
          git push origin HEAD:fix/sousou-bg-png
