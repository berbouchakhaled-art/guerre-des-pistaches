name: Commit Sousou map bg
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commit-sousou-bg-asset.yml'
      - 'assets/sousou-bg.b64'
      - 'scripts/sousou-map-bg.patch'
jobs:
  commit-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sousou-map-bg
      - name: Apply patch, decode PNG, commit
        run: |
          set -euo pipefail
          mkdir -p assets
          test -f assets/sousou-bg.b64
          test -f scripts/sousou-map-bg.patch
          base64 -d assets/sousou-bg.b64 > assets/sousou-bg.png
          python3 -c "import pathlib; d=pathlib.Path('assets/sousou-bg.png').read_bytes(); assert d[:8]==b'\x89PNG\r\n\x1a\n' and len(d)>1000, len(d); print('png', len(d))"
          patch -p1 < scripts/sousou-map-bg.patch
          grep -q drawSousouMapBackground index.html
          rm -f assets/sousou-bg.b64
          rm -f scripts/sousou-map-bg.patch
          rm -f scripts/apply_sousou_menu_portrait.py
          rm -f .github/workflows/commit-sousou-bg-asset.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: large Sousou map bg (576px NN) + draw watermark on all levels"
          git push origin HEAD:feature/sousou-map-bg
