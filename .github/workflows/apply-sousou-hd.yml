name: Apply sousou-hd patch
on:
  push:
    branches: [fix/sousou-hd]
    paths:
      - 'patches/sousou-hd.patch'
      - '.github/workflows/apply-sousou-hd.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sousou-hd
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply patch, regenerate sprites, verify manifest, commit
        run: |
          set -euo pipefail
          pip install pillow==12.3.0 numpy==2.2.4
          sed 's/^$/ /' patches/sousou-hd.patch > /tmp/p.patch
          git apply /tmp/p.patch
          python3 tools/gfx/gen_all.py
          python3 tools/gfx/check_manifest.py | tee /tmp/man.txt
          grep -q "^mismatches: 0$" /tmp/man.txt
          find tools -name __pycache__ -prune -exec rm -rf {} +
          git rm -q patches/sousou-hd.patch .github/workflows/apply-sousou-hd.yml
          git add -A index.html js tools assets
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sousou HD: faithful 3x upscale of the approved 48x64 sprite (Scale3x + refined cute face); pixel-exact rendering (1 art px = 1 canvas px = integer device px, no squash/stretch, integer menu scale, exact CSS canvas size)"
          git push origin HEAD:fix/sousou-hd
