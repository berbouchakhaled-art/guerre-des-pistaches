name: Apply menu2 + HD Sousou patch
# Assemble patches/mf2.*.patch, apply them, regenerate pixel-art assets
# (incl. sousou-sprite-hd.png + logo_font.png), check the manifest, commit, then remove itself.
on:
  push:
    branches: [mobile/mobile-first]
    paths:
      - ".github/workflows/menu2-hd-build.yml"
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/mobile-first
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Apply patch parts
        run: |
          set -euo pipefail
          cat patches/mf2.0.patch patches/mf2.1.patch patches/mf2.2.patch | sed 's/^$/ /' > /tmp/mf2.patch
          git apply --whitespace=nowarn /tmp/mf2.patch
          grep -q 'css/menu.css' index.html
          grep -q 'sousouHD' js/gfx.js
          git rm -q patches/mf2.0.patch patches/mf2.1.patch patches/mf2.2.patch
      - name: Generate assets
        run: |
          set -euo pipefail
          pip install "pillow==12.3.0" "numpy==2.2.4"
          python3 tools/gfx/gen_all.py
          python3 tools/gfx/check_manifest.py | tee /tmp/manifest.log
          grep -q "mismatches: 0" /tmp/manifest.log
          find tools -name __pycache__ -type d -prune -exec rm -rf {} +
      - name: Commit
        run: |
          set -euo pipefail
          git rm -q .github/workflows/menu2-hd-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/gfx.js css/mobile.css tools/gfx assets
          git commit -m "mobile: bigger HD Sousou in game + new animated pixel menu (applied patch + generated assets)"
          git push origin HEAD:mobile/mobile-first
