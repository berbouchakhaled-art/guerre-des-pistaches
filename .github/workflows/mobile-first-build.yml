name: Mobile-first build
# Applique patches/mobile-first.part*.patch (index.html + js/gfx.js), régénère les
# images pixel (dont assets/gfx/ui.png, btn_*.png, rotate.png, assets/icons/*),
# vérifie le manifeste, puis commit le résultat et se supprime.
on:
  push:
    branches: [mobile/mobile-first]
    paths:
      - ".github/workflows/mobile-first-build.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mobile/mobile-first
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply patch
        run: |
          set -euo pipefail
          if [ -f patches/mobile-first.part1.patch ]; then
            cat patches/mobile-first.part1.patch patches/mobile-first.part2.patch patches/mobile-first.part3.patch | sed 's/^$/ /' > /tmp/mf.patch
            git apply --verbose /tmp/mf.patch
            git rm -q patches/mobile-first.part1.patch patches/mobile-first.part2.patch patches/mobile-first.part3.patch
          fi
          grep -q 'css/mobile.css' index.html
          grep -q 'function applyView' index.html
          grep -q 'drawHudMobile' js/gfx.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generate assets
        run: |
          set -euo pipefail
          pip install "pillow==12.3.0" "numpy==2.2.4"
          python3 tools/gfx/gen_all.py
          python3 tools/gfx/check_manifest.py | tee /tmp/check.txt
          grep -q '^mismatches: 0$' /tmp/check.txt
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/mobile-first-build.yml
          git add index.html js/gfx.js assets
          git commit -m "mobile: apply index.html/js/gfx.js changes + generated UI assets (touch buttons, rotate prompt, app icons)"
          git push origin HEAD:mobile/mobile-first
