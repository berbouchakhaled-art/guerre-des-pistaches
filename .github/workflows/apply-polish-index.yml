name: Apply polish index
on:
  push:
    paths:
      - 'payload/index.polish.gz.b64.part*'
      - 'payload/index.polish.gz.b64.parts'
      - '.github/workflows/apply-polish-index.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Decode and commit index.html
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, pathlib
          n = int(pathlib.Path('payload/index.polish.gz.b64.parts').read_text().strip())
          b64 = ''.join(pathlib.Path(f'payload/index.polish.gz.b64.part{i}').read_text().strip() for i in range(n))
          raw = gzip.decompress(base64.b64decode(b64))
          pathlib.Path('index.html').write_bytes(raw)
          print('wrote index.html', len(raw))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "polish: apply contrôles FR + graphismes + fluidité"
            git push
          fi
