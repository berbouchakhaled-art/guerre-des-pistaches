name: Apply polish index
on:
  push:
    branches: [polish/fr-controls-gfx-fluid]
    paths:
      - "payload/index.polish.patch.gz.b64"
      - "payload/index.polish.patch.gz.b64.a"
      - "payload/index.polish.patch.gz.b64.b"
      - ".github/workflows/apply-polish-index.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/fr-controls-gfx-fluid
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply gzipped patch to index.html
        run: |
          set -euo pipefail
          if [ -f payload/index.polish.patch.gz.b64 ]; then
            SRC=payload/index.polish.patch.gz.b64
            tr -d '\n\r \t' < "$SRC" | base64 -d | gunzip > /tmp/polish.patch
          else
            test -f payload/index.polish.patch.gz.b64.a
            test -f payload/index.polish.patch.gz.b64.b
            cat payload/index.polish.patch.gz.b64.a payload/index.polish.patch.gz.b64.b | tr -d '\n\r \t' | base64 -d | gunzip > /tmp/polish.patch
          fi
          git apply --whitespace=nowarn /tmp/polish.patch
          grep -q AZERTY index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html changes"
            exit 0
          fi
          git commit -m "polish: FR controls, gfx, fluidity for French users"
          git push origin HEAD:polish/fr-controls-gfx-fluid
