name: Commit Sousou menu asset
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commit-sousou-menu-asset.yml'
jobs:
  commit-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sousou-menu-v5
      - name: Fix corrupt b64 from history, decode PNG, commit
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fsSL -o /tmp/sousou.b64 \
            "https://raw.githubusercontent.com/berbouchakhaled-art/guerre-des-pistaches/1439f8da9d7efb13a3a929c8234604cc58211bff/assets/sousou-menu.b64"
          python3 -c "from pathlib import Path; import base64,hashlib; remote=Path('/tmp/sousou.b64').read_text().strip(); fixed=remote.replace('Jnaxa','Jnexa',1); assert 'Jnaxa' in remote and fixed!=remote; d=base64.b64decode(fixed); assert d[:8]==b'\x89PNG\r\n\x1a\n'; assert hashlib.sha256(d).hexdigest()[:16]=='af126fa3914df404'; Path('assets/sousou-menu.png').write_bytes(d); print('png',len(d),'ok')"
          rm -f .github/workflows/commit-sousou-menu-asset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Fix sousou-menu.png to exact colorful transparent v5 asset"
          git push origin HEAD:feature/sousou-menu-v5
