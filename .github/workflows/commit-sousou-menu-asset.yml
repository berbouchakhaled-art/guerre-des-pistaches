name: Commit Sousou menu asset
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/commit-sousou-menu-asset.yml'
      - 'assets/sousou-menu.b64'
jobs:
  commit-asset:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sousou-menu-portrait
      - name: Decode PNG and commit
        run: |
          set -euo pipefail
          mkdir -p assets
          test -f assets/sousou-menu.b64
          base64 -d assets/sousou-menu.b64 > assets/sousou-menu.png
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('assets/sousou-menu.png')
          assert im.size == (128, 128), im.size
          print('ok', im.size, im.mode)
          PY
          rm -f assets/sousou-menu.b64
          rm -f .github/workflows/commit-sousou-menu-asset.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Add assets/sousou-menu.png (40px hard 80s sprite, nearest upscale)"
          git push origin HEAD:feature/sousou-menu-portrait
