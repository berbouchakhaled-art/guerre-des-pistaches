name: Apply Sousou index patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-sousou-index-patch.yml'
      - 'assets/index.patch.gz.b64'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sousou-menu-portrait
      - name: Apply patch and commit
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, pathlib, subprocess
          b64 = pathlib.Path('assets/index.patch.gz.b64').read_text().strip()
          diff = gzip.decompress(base64.b64decode(b64)).decode('utf-8')
          pathlib.Path('index.patch').write_text(diff)
          r = subprocess.run(['patch','-p1','--batch','--fuzz=0'], input=diff, text=True, capture_output=True)
          print(r.stdout)
          print(r.stderr)
          if r.returncode != 0:
              raise SystemExit(r.returncode)
          data = pathlib.Path('index.html').read_bytes()
          assert data.startswith(b'<!DOCTYPE html>')
          assert b'sousou-portrait' in data and b'MAX_PARTICLES' in data
          assert b'assets/sousou-menu.png' in data
          print('patched index.html', len(data))
          PY
          rm -f assets/index.patch.gz.b64 index.patch
          rm -f .github/workflows/apply-sousou-index-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(menu): Sousou 80s pixel portrait on start screen + light perf"
          git push origin HEAD:feature/sousou-menu-portrait
