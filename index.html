<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>La guerre des pistaches — starring Sousou</title>
<style>html,body{margin:0;height:100%;background:#0d1a0c;color:#c8e6a0;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center}#b{text-align:center}.s{color:#ffeb3b;font-size:1.5rem}</style>
</head><body><div id="b"><div class="s">★ SOUSOU ★</div><p>Chargement de La guerre des pistaches…</p></div>
<script>
(async()=>{
  const N=6;
  const MAIN_SHA='57ac0ae4575c6779cba04420d239a51e53d7dae6';
  const hexParts=await Promise.all([...Array(N).keys()].map(i=>fetch('h'+String(i).padStart(2,'0')+'.hex').then(r=>{if(!r.ok)throw new Error('h'+i+' '+r.status);return r.text()})));
  const hex=hexParts.map(t=>t.trim().toLowerCase()).join('');
  const gz=Uint8Array.from(hex.match(/.{1,2}/g).map(b=>parseInt(b,16)));
  if(typeof DecompressionStream==='undefined')throw new Error('gzip requis');
  const ops=JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
  const baseUrl='https://raw.githubusercontent.com/berbouchakhaled-art/guerre-des-pistaches/'+MAIN_SHA+'/index.html';
  const base=await fetch(baseUrl).then(r=>{if(!r.ok)throw new Error('base '+r.status);return r.text()});
  const lines=base.split(/(?<=\n)/);
  for(let k=ops.length-1;k>=0;k--){
    const [i1,nd,ins]=ops[k];
    lines.splice(i1,nd,...ins);
  }
  document.open();document.write(lines.join(''));document.close();
})().catch(e=>{document.getElementById('b').innerHTML='<p>Erreur: '+e.message+'</p><p>Réseau requis (chargement du jeu de base + polish).</p>';});
</script></body></html>
